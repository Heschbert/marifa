<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, -apple-system, Segoe UI, sans-serif"><title>Leistung mal Dauer ergibt Energie</title><rect width="640" height="360" rx="18" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker></defs><text x="32" y="44" text-anchor="start" font-size="22" font-weight="800" fill="#1f2328">Leistung × Dauer = Energie</text><line x1="90" y1="300" x2="600" y2="300" stroke="#1f2328" stroke-width="2"/><line x1="90" y1="300" x2="90" y2="80" stroke="#1f2328" stroke-width="2"/><rect x="91" y="140" width="400" height="159" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/><text x="291" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#2b8a3e">Energie = 10 MW × 2 h = 20 MWh</text><text x="70" y="145" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">10 MW</text><text x="70" y="300" text-anchor="end" font-size="15" font-weight="400" fill="#1f2328">0</text><text x="491" y="324" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2328">2 h</text><text x="345" y="348" text-anchor="middle" font-size="15" font-weight="400" fill="#5f687c">Dauer →</text><text x="40" y="220" text-anchor="middle" font-size="15" font-weight="400" fill="#5f687c">Leistung</text></svg>