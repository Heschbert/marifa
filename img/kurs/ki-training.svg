<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, -apple-system, Segoe UI, sans-serif"><title>Trainingsphasen eines Assistenten</title><rect width="640" height="360" rx="18" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker></defs><text x="32" y="44" text-anchor="start" font-size="22" font-weight="800" fill="#1f2328">Vom Rohmodell zum Assistenten</text><path d="M30 140 L158 140 L180 185 L158 230 L30 230 L30 185 Z" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/><text x="102" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#2b8a3e">Vortraining</text><text x="102" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#5f687c">nächstes Token</text><path d="M178 140 L306 140 L328 185 L306 230 L178 230 L200 185 Z" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/><text x="250" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Fine-Tuning</text><text x="250" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#5f687c">gute Beispiele</text><path d="M326 140 L454 140 L476 185 L454 230 L326 230 L348 185 Z" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/><text x="398" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">RLHF</text><text x="398" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#5f687c">Präferenzen</text><path d="M474 140 L602 140 L624 185 L602 230 L474 230 L496 185 Z" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/><text x="546" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Reasoning</text><text x="546" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#5f687c">länger nachdenken</text><text x="320" y="290" text-anchor="middle" font-size="16" font-weight="400" fill="#5f687c">Das Vortraining kostet den Großteil der Rechenleistung.</text></svg>